[project]
name = "adaptive-bottleneck"
version = "0.1.0"
description = "Adaptive relational cross attention (ARCA): a learnable interpolation between cross attention and the relational bottleneck"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Keith T. Murray", email = "murraykeith64@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax>=0.8.1",
    "jax-dataloader>=0.1.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "optax>=0.2.6",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
